name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: "production"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        run: |
          SHA=${GITHUB_SHA::7}
          DEPOT=ghcr.io/${{ github.repository }}
          docker build -t $DEPOT:latest -t $DEPOT:$SHA -t $DEPOT:1.0.0 .
          docker push $DEPOT:latest
          docker push $DEPOT:$SHA
          docker push $DEPOT:1.0.0

      - name: Deploiement et verification
        run: |
          DEPOT=ghcr.io/${{ github.repository }}
          docker run -d --name test-redis redis:alpine
          docker run -d --name web -p 8000:8000 --link test-redis:redis -e REDIS_HOST=redis $DEPOT:${GITHUB_SHA::7}

          for i in 1 2 3; do
            curl -f http://localhost:8000/health && break
            sleep 2
            if [ $i -eq 3 ]; then
              ANCIEN=$(git rev-parse --short HEAD~1 2>/dev/null || true)
              docker rm -f web
              [ -n "$ANCIEN" ] && docker pull $DEPOT:$ANCIEN && docker run -d --name web -p 8000:8000 $DEPOT:$ANCIEN
              exit 1
            fi
          done
